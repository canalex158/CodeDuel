spring.application.name=codeduel-server
spring.main.banner-mode=off
server.address=${CODEDUEL_BIND:127.0.0.1}
server.port=${CODEDUEL_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
codeduel.judge-url=${CODEDUEL_JUDGE_URL:http://127.0.0.1:8091/evaluate}
codeduel.judge-token=${CODEDUEL_JUDGE_TOKEN:}
